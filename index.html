<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Subway Tuffs</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; touch-action: none; }
    canvas { display: block; background: #87CEEB; }
    #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-family: Arial, sans-serif; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 0 #000; pointer-events: none; }
  </style>
</head>
<body>
<div id="ui">Moedas: <span id="score">0</span></div>
<canvas id="game"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');

  // Ajusta tamanho da tela
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Configurações do Jogo
  const LANES = [canvas.width * 0.25, canvas.width * 0.5, canvas.width * 0.75];
  let currentLane = 1; // 0 = esquerda, 1 = meio, 2 = direita
  
  const player = {
    x: LANES[1], y: canvas.height - 150,
    w: 40, h: 60, targetX: LANES[1],
    jumping: false, vy: 0
  };

  let coins = [];
  let obstacles = [];
  let speed = 5;
  let score = 0;
  let gameOver = false;
  let gameSpeed = 6;
  
  // Controle de toque (Swipe)
  let touchStartX = 0;
  let touchStartY = 0;

  // Controles
  document.addEventListener('keydown', e => {
    if (gameOver) return;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') move(-1);
    if (e.code === 'KeyD' || e.code === 'ArrowRight') move(1);
    if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') jump();
  });

  canvas.addEventListener('touchstart', e => {
    if (gameOver) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });

  canvas.addEventListener('touchend', e => {
    if (gameOver) return;
    let touchEndX = e.changedTouches[0].clientX;
    let touchEndY = e.changedTouches[0].clientY;
    
    let dx = touchEndX - touchStartX;
    let dy = touchEndY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 30) move(1); // Swipe Direita
      else if (dx < -30) move(-1); // Swipe Esquerda
    } else {
      if (dy < -30) jump(); // Swipe Cima
    }
  });

  function move(dir) {
    currentLane += dir;
    if (currentLane < 0) currentLane = 0;
    if (currentLane > 2) currentLane = 2;
    player.targetX = LANES[currentLane];
  }

  function jump() {
    if (!player.jumping) {
      player.vy = -15;
      player.jumping = true;
    }
  }

  // Spawn de itens
  let spawnTimer = 0;
  function spawnItems() {
    if (gameOver) return;
    spawnTimer++;
    if (spawnTimer > 60) { // A cada ~1 segundo
      spawnTimer = 0;
      let lane = Math.floor(Math.random() * 3);
      let isCoin = Math.random() > 0.4; // 60% chance de moeda

      if (isCoin) {
        coins.push({ x: LANES[lane], y: -50, w: 20, h: 20 });
      } else {
        // Se for obstáculo, garante que não bloqueie todas as pistas
        obstacles.push({ x: LANES[lane], y: -50, w: 40, h: 40 });
      }
    }
  }

  function update() {
    if (gameOver) return;

    // Movimento suave para o lado
    player.x += (player.targetX - player.x) * 0.2;

    // Física do pulo
    player.vy += 0.8; // Gravidade
    player.y += player.vy;
    const groundY = canvas.height - 150;
    if (player.y >= groundY) {
      player.y = groundY;
      player.vy = 0;
      player.jumping = false;
    }

    // Move moedas
    coins.forEach(c => c.y += gameSpeed);
    coins = coins.filter(c => c.y < canvas.height + 50);

    // Move obstáculos
    obstacles.forEach(o => o.y += gameSpeed);
    obstacles = obstacles.filter(o => o.y < canvas.height + 50);

    // Colisão com moedas
    coins.forEach((c, i) => {
      if (Math.abs(player.x - c.x) < 30 && Math.abs((player.y + player.h/2) - c.y) < 30) {
        coins.splice(i, 1);
        score += 10;
        scoreEl.innerText = score;
      }
    });

    // Colisão com obstáculos
    obstacles.forEach(o => {
      if (Math.abs(player.x - o.x) < 35 && Math.abs((player.y + player.h) - (o.y + o.h)) < 40) {
        gameOver = true;
      }
    });

    // Aumenta a dificuldade
    gameSpeed += 0.001;
  }

  function draw() {
    // Desenha cenário de fundo (pistas)
    ctx.fillStyle = '#333';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Desenha as linhas da pista
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 5;
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      // Linhas entre as pistas
      let lineX = canvas.width * (i === 0 ? 0.37 : 0.62); 
      if(i === 0 || i === 1) {
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, canvas.height);
      }
    }
    ctx.stroke();
    ctx.setLineDash([]); // Reseta o tracejado

    // Desenha o chão
    ctx.fillStyle = '#222';
    ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

    // Jogador (Estilo boneco)
    ctx.fillStyle = '#4fc3f7';
    // Corpo
    ctx.fillRect(player.x - 15, player.y + 20, 30, 30);
    // Cabeça
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.x, player.y + 15, 15, 0, Math.PI * 2);
    ctx.fill();

    // Moedas
    coins.forEach(c => {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#B8860B';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // Obstáculos
    obstacles.forEach(o => {
      ctx.fillStyle = '#e53935';
      ctx.fillRect(o.x - 20, o.y - 20, 40, 40);
      ctx.fillStyle = '#b71c1c';
      ctx.fillRect(o.x - 15, o.y - 15, 30, 30);
    });

    // Tela de Game Over
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 20);
      ctx.font = '20px Arial';
      ctx.fillText('Clique ou Toque para reiniciar', canvas.width/2, canvas.height/2 + 30);
    }
  }

  // Reiniciar no Clique (PC/Mobile)
  canvas.addEventListener('click', () => {
    if (gameOver) {
      gameOver = false;
      score = 0;
      scoreEl.innerText = score;
      coins = [];
      obstacles = [];
      player.y = canvas.height - 150;
      gameSpeed = 6;
      currentLane = 1;
      player.targetX = LANES[1];
      player.x = LANES[1];
    }
  });

  function loop() {
    spawnItems();
    update();
    draw();
    requestAnimationFrame(loop);
  }
  
  loop();
</script>
</body>
</html>
