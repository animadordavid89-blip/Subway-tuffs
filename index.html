<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arquivo limpo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      .container {
        text-align: center;
        padding: 32px 48px;
        border: 1px solid #333;
        border-radius: 12px;
        background: #1c1c1c;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: #ddd;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Arquivo limpo</h1>
      <p>O código do jogo foi removido deste arquivo.</p>
    </div>
  </body>
</html>
